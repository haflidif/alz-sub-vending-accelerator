{{- $destination := .Destination -}}
{{- if not (urls.Parse $destination).IsAbs -}}
  {{- with .Page.GetPage $destination -}}
    {{- $destination = .RelPermalink -}}
  {{- end -}}
{{- end -}}
<a href="{{ $destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
