name: Apply

# -----------------------------------------------------------------------------
# Three trigger modes:
#   1. push to main         — auto: applies subscriptions whose YAML changed
#                             between the previous and current commit. Shared
#                             engine/platform changes require a manual mode=all
#                             run after merge.
#   2. workflow_dispatch    — manual: choose mode
#                               • changed (default)
#                               • single  (specify sub_path)
#                               • all     (re-applies every YAML in repo)
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
    paths:
      - 'landingzones/*/*.yaml'
      - 'landingzones/sub.schema.json'
      - 'terraform/**'
      - 'bicep/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Selection mode
        type: choice
        default: changed
        options: [changed, single, all]
      sub_path:
        description: 'For mode=single: path to the sub YAML, e.g. landingzones/corp/prod-corp-erp-001.yaml (the .yaml suffix is optional)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

# Top-level concurrency keeps the dispatch queue ordered. Per-archetype/sub
# concurrency is set on the apply job below to allow parallel vending of
# different subscriptions while still serialising same-sub re-runs.
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0) Do not execute sample subscriptions in the accelerator source repo
  # ---------------------------------------------------------------------------
  runtime-check:
    name: Detect generated vending repository
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.runtime.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect runtime repository
        id: runtime
        shell: bash
        run: |
          if [[ -d powershell && -d starters && -d tests ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Accelerator source repository detected; skipping runtime apply."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 1) Discover which subscriptions to apply
  # ---------------------------------------------------------------------------
  discover:
    name: Discover subscriptions
    needs: runtime-check
    if: needs.runtime-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count:  ${{ steps.set.outputs.count }}
      shared_changed: ${{ steps.set.outputs.shared_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover
        id: set
        env:
          MODE:     ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'changed' }}
          SUB_PATH: ${{ inputs.sub_path }}
          BASE:     ${{ github.event.before || 'HEAD~1' }}
          HEAD:     ${{ github.sha }}
          VENDING_ENGINE: ${{ vars.VENDING_ENGINE || 'terraform' }}
          INCLUDE_SHARED_CHANGES: ${{ github.event_name == 'push' && 'false' || 'true' }}
        run: bash .github/scripts/discover-subs.sh

  # ---------------------------------------------------------------------------
  # 2) Explain why a shared change did not deploy automatically
  # ---------------------------------------------------------------------------
  shared-change-notice:
    name: Shared change requires explicit deployment
    needs: discover
    if: github.event_name == 'push' && needs.discover.outputs.shared_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment guidance
        shell: bash
        run: |
          {
            echo "## Shared change merged without automatic deployment"
            echo ""
            echo "This merge changed shared engine, platform, schema, or delivery files."
            echo "No subscriptions were selected automatically."
            echo ""
            echo "Review the merged change, then run **Actions > Apply > Run workflow**"
            echo "with **mode = all** when you are ready to deploy it across the fleet."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3) Apply each subscription with its own state
  # ---------------------------------------------------------------------------
  apply:
    name: Apply ${{ matrix.archetype }}/${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.count != '0' && (vars.VENDING_ENGINE == '' || vars.VENDING_ENGINE == 'terraform')
    runs-on: ubuntu-latest
    # Per-sub concurrency: same subscription cannot apply twice in parallel
    # (state-locking would fight us anyway), but different subs run freely.
    concurrency:
      group: apply-${{ matrix.archetype }}-${{ matrix.name }}
      cancel-in-progress: false
    # Use a GitHub Environment to require manual approval before apply.
    # Configure required reviewers in repo Settings → Environments → "production".
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      ARM_USE_AZUREAD: 'true'
      ARM_USE_OIDC:    'true'
      ARM_CLIENT_ID:        ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:        ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME: '60m'
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (per-sub state)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ matrix.state_key }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_sub_yaml_path: ../${{ matrix.sub_path }}
        run: |
          terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -input=false -no-color tfplan
          terraform output -json > vending-outputs.json

      - name: Publish Terraform deployment summary
        if: always()
        working-directory: terraform
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          subscription_id="Unavailable"
          subscription_resource_id="Unavailable"
          management_group_id="Unavailable"
          alias_name="${{ matrix.name }}"
          effective_tags="Unavailable"

          if [[ -f vending-outputs.json ]]; then
            subscription_id="$(jq -r '.subscription_id.value // "Unavailable"' vending-outputs.json)"
            subscription_resource_id="$(jq -r '.subscription_resource_id.value // "Unavailable"' vending-outputs.json)"
            management_group_id="$(jq -r '.management_group_id.value // "Unavailable"' vending-outputs.json)"
            alias_name="$(jq -r '.alias_name.value // "${{ matrix.name }}"' vending-outputs.json)"
            effective_tags="$(jq -c '.effective_tags.value // "Unavailable"' vending-outputs.json)"
          fi

          {
            echo "## Subscription vending result"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Engine | Terraform |"
            echo "| Status | ${JOB_STATUS} |"
            echo "| Request | \`${{ matrix.sub_path }}\` |"
            echo "| Alias | \`${alias_name}\` |"
            echo "| Archetype | \`${{ matrix.archetype }}\` |"
            echo "| Subscription ID | \`${subscription_id}\` |"
            echo "| Subscription resource ID | \`${subscription_resource_id}\` |"
            echo "| Management group | \`${management_group_id}\` |"
            echo "| State key | \`${{ matrix.state_key }}\` |"
            echo ""
            echo "### Effective tags"
            echo ""
            echo '```json'
            echo "$effective_tags" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apply-${{ matrix.archetype }}-${{ matrix.name }}
          path: |
            terraform/tfplan
            terraform/vending-outputs.json
          retention-days: 30

  bicep-apply:
    name: Deploy ${{ matrix.archetype }}/${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.count != '0' && vars.VENDING_ENGINE == 'bicep'
    runs-on: ubuntu-latest
    concurrency:
      group: apply-${{ matrix.archetype }}-${{ matrix.name }}
      cancel-in-progress: false
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep request compiler dependencies
        shell: pwsh
        run: Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Compile subscription request
        shell: pwsh
        run: |
          Import-Module ./bicep/SubscriptionVending.Bicep.psm1
          New-BicepSubscriptionParameters `
            -RequestPath '${{ matrix.sub_path }}' `
            -PlatformPath './bicep/platform.json' `
            -OutputPath './bicep/request.parameters.json'

      - name: Deploy Bicep subscription
        shell: bash
        run: |
          az bicep install --version v0.47.16
          deployment_name="$(printf 'vend-%s' '${{ matrix.name }}' | cut -c1-64)"
          echo "BICEP_DEPLOYMENT_NAME=$deployment_name" >> "$GITHUB_ENV"
          echo "::notice title=Subscription deployment started::Deploying ${{ matrix.name }}. Azure subscription propagation and resource provider registration can take 15 to 30 minutes."

          az deployment mg create \
            --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --name "$deployment_name" \
            --template-file bicep/main.bicep \
            --parameters @bicep/request.parameters.json \
            --no-wait \
            --only-show-errors

          started_at="$(date +%s)"
          status_failures=0
          while true; do
            elapsed="$(( $(date +%s) - started_at ))"
            if ! provisioning_state="$(az deployment mg show \
              --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
              --name "$deployment_name" \
              --query properties.provisioningState \
              --output tsv \
              --only-show-errors 2>bicep/deployment-status-error.txt)"; then
              status_failures="$(( status_failures + 1 ))"
              if (( elapsed < 120 || status_failures < 4 )); then
                echo "Deployment status is not available yet. Retrying in 15 seconds. Elapsed: ${elapsed}s."
                sleep 15
                continue
              fi
              cat bicep/deployment-status-error.txt
              echo "BICEP_DEPLOYMENT_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_ENV"
              exit 1
            fi
            status_failures=0
            : > bicep/deployment-status-error.txt

            echo "Deployment state: ${provisioning_state}. Elapsed: ${elapsed}s."
            case "$provisioning_state" in
              Succeeded)
                echo "BICEP_DEPLOYMENT_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_ENV"
                break
                ;;
              Failed|Canceled)
                az deployment mg show \
                  --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
                  --name "$deployment_name" \
                  --output json > bicep/deployment.json || true
                az deployment operation mg list \
                  --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
                  --name "$deployment_name" \
                  --query "[?properties.provisioningState=='Failed'].properties.statusMessage" \
                  --output json || true
                echo "BICEP_DEPLOYMENT_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_ENV"
                exit 1
                ;;
            esac

            if (( elapsed >= 3600 )); then
              echo "::error::Deployment did not complete within 60 minutes."
              az deployment mg show \
                --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
                --name "$deployment_name" \
                --output json > bicep/deployment.json || true
              echo "BICEP_DEPLOYMENT_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_ENV"
              exit 1
            fi
            sleep 30
          done

          az deployment mg show \
            --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
            --name "$deployment_name" \
            --output json > bicep/deployment.json

      - name: Publish Bicep deployment summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          provisioning_state="Unavailable"
          subscription_id="Unavailable"
          subscription_resource_id="Unavailable"
          budget_resource_id="Unavailable"
          failed_providers="Unavailable"
          failed_provider_features="Unavailable"

          if [[ -f bicep/deployment.json ]]; then
            provisioning_state="$(jq -r '.properties.provisioningState // "Unavailable"' bicep/deployment.json)"
            subscription_id="$(jq -r '.properties.outputs.subscriptionId.value // "Unavailable"' bicep/deployment.json)"
            subscription_resource_id="$(jq -r '.properties.outputs.subscriptionResourceId.value // "Unavailable"' bicep/deployment.json)"
            budget_resource_id="$(jq -r '.properties.outputs.budgetResourceId.value // "Unavailable"' bicep/deployment.json)"
            failed_providers="$(jq -r '.properties.outputs.failedResourceProviders.value // "Unavailable"' bicep/deployment.json)"
            failed_provider_features="$(jq -r '.properties.outputs.failedResourceProviderFeatures.value // "Unavailable"' bicep/deployment.json)"
          fi

          {
            echo "## Subscription vending result"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Engine | Bicep |"
            echo "| Job status | ${JOB_STATUS} |"
            echo "| Azure deployment state | ${provisioning_state} |"
            echo "| Request | \`${{ matrix.sub_path }}\` |"
            echo "| Archetype | \`${{ matrix.archetype }}\` |"
            echo "| Deployment | \`${BICEP_DEPLOYMENT_NAME:-Unavailable}\` |"
            echo "| Elapsed | ${BICEP_DEPLOYMENT_ELAPSED_SECONDS:-Unavailable} seconds |"
            echo "| Subscription ID | \`${subscription_id}\` |"
            echo "| Subscription resource ID | \`${subscription_resource_id}\` |"
            echo "| Management group | \`${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}\` |"
            echo "| Budget resource ID | \`${budget_resource_id}\` |"
            echo "| Failed resource providers | ${failed_providers} |"
            echo "| Failed provider features | ${failed_provider_features} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f bicep/deployment.json ]] && jq -e '.properties.error != null' bicep/deployment.json > /dev/null; then
            {
              echo ""
              echo "### Azure deployment error"
              echo ""
              echo '```json'
              jq '.properties.error' bicep/deployment.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ -s bicep/deployment-status-error.txt ]]; then
            {
              echo ""
              echo "### Deployment status error"
              echo ""
              echo '```text'
              cat bicep/deployment-status-error.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-${{ matrix.archetype }}-${{ matrix.name }}
          path: |
            bicep/request.parameters.json
            bicep/deployment.json
            bicep/deployment-status-error.txt
          if-no-files-found: ignore
          retention-days: 30
