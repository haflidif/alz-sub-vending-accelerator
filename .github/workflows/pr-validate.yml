name: PR Validate

# -----------------------------------------------------------------------------
# Runs on every PR to main so required-check names always report a status
# (avoids the "Expected — Waiting for status to be reported" deadlock when a
# PR only touches docs / unrelated paths).
#
# The schema-validate job exits 0 when no sub YAML files exist; the discover
# job outputs count=0 when no subscription is affected, which makes the plan
# matrix skip; the result job reports the final required check.
# -----------------------------------------------------------------------------
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write          # OIDC federation to Azure
  contents: read
  pull-requests: write     # post plan comments

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0) Validate every sub YAML against landingzones/sub.schema.json
  #    (fail fast — bad data should never reach `terraform plan`)
  # ---------------------------------------------------------------------------
  schema-validate:
    name: YAML schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install check-jsonschema
        run: pipx install 'check-jsonschema==0.37.2'

      - name: Validate all sub YAML files
        run: |
          shopt -s nullglob
          files=(landingzones/*/*.yaml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No subscription YAML files found — skipping."
            exit 0
          fi
          echo "Validating ${#files[@]} file(s) against landingzones/sub.schema.json"
          check-jsonschema \
            --schemafile landingzones/sub.schema.json \
            "${files[@]}"

  # ---------------------------------------------------------------------------
  # 1) Discover which subscriptions changed in this PR
  # ---------------------------------------------------------------------------
  discover:
    name: Discover changed subscriptions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count:  ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history for git diff

      - name: Detect changed subscriptions
        id: set
        env:
          MODE: changed
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/discover-subs.sh

  # ---------------------------------------------------------------------------
  # 2) Plan each affected subscription in its own job (per-state isolation)
  # ---------------------------------------------------------------------------
  plan:
    name: Plan ${{ matrix.archetype }}/${{ matrix.name }}
    needs: [schema-validate, discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      ARM_USE_AZUREAD: 'true'
      ARM_USE_OIDC:    'true'
      ARM_CLIENT_ID:        ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:        ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME: '60m'
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (per-sub state)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ matrix.state_key }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_sub_yaml_path: ../${{ matrix.sub_path }}
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const trimmed = plan.length > 60000 ? plan.slice(0, 60000) + '\n...[truncated]' : plan;
            const body = `### Plan: \`${{ matrix.archetype }}/${{ matrix.name }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${trimmed}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - uses: actions/upload-artifact@v7
        with:
          name: plan-${{ matrix.archetype }}-${{ matrix.name }}
          path: terraform/tfplan
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3) Final gate — fails the check if any matrix job failed
  # ---------------------------------------------------------------------------
  result:
    name: PR Validate Result
    needs: [schema-validate, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.schema-validate.result }}" == "failure" ]]; then
            echo "Schema validation failed."
            exit 1
          fi
          if [[ "${{ needs.plan.result }}" == "failure" || "${{ needs.plan.result }}" == "cancelled" ]]; then
            echo "One or more plan jobs failed."
            exit 1
          fi
          echo "All checks completed."
