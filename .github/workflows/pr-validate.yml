name: PR Validate

# -----------------------------------------------------------------------------
# Runs on every PR to main so required-check names always report a status
# (avoids the "Expected — Waiting for status to be reported" deadlock when a
# PR only touches docs / unrelated paths).
#
# The schema-validate job exits 0 when no sub YAML files exist; the discover
# job outputs count=0 when no subscription is affected, which makes the plan
# matrix skip; the result job reports the final required check.
# -----------------------------------------------------------------------------
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write          # OIDC federation to Azure
  contents: read
  pull-requests: write     # post plan comments

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0) Validate every sub YAML against landingzones/sub.schema.json
  #    (fail fast — bad data should never reach `terraform plan`)
  # ---------------------------------------------------------------------------
  schema-validate:
    name: YAML schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install check-jsonschema
        run: pipx install 'check-jsonschema==0.37.2'

      - name: Validate all sub YAML files
        run: |
          shopt -s nullglob
          files=(landingzones/*/*.yaml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No subscription YAML files found — skipping."
            exit 0
          fi
          echo "Validating ${#files[@]} file(s) against landingzones/sub.schema.json"
          check-jsonschema \
            --schemafile landingzones/sub.schema.json \
            "${files[@]}"

  # ---------------------------------------------------------------------------
  # 1) Discover which subscriptions changed in this PR
  # ---------------------------------------------------------------------------
  discover:
    name: Discover changed subscriptions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count:  ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history for git diff

      - name: Detect changed subscriptions
        id: set
        env:
          MODE: changed
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          VENDING_ENGINE: ${{ vars.VENDING_ENGINE || 'terraform' }}
        run: bash .github/scripts/discover-subs.sh

  # ---------------------------------------------------------------------------
  # 2) Validate accelerator sources when this is the accelerator repository
  # ---------------------------------------------------------------------------
  accelerator-validate:
    name: Accelerator validation
    runs-on: ubuntu-latest
    outputs:
      sources-available: ${{ steps.accelerator.outputs.available }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect accelerator sources
        id: accelerator
        shell: bash
        run: |
          if [[ ! -e powershell && ! -e starters && ! -e tests ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Accelerator sources are absent; skipping accelerator tests."
            exit 0
          fi
          [[ -d powershell ]] || { echo "::error::powershell/ is missing"; exit 1; }
          [[ -d starters ]] || { echo "::error::starters/ is missing"; exit 1; }
          [[ -f tests/PowerShell/SubscriptionVending.Tests.ps1 ]] \
            || { echo "::error::PowerShell accelerator test is missing"; exit 1; }
          [[ -f tests/PowerShell/BicepStarter.Tests.ps1 ]] \
            || { echo "::error::Bicep starter test is missing"; exit 1; }
          [[ -f tests/PowerShell/BillingRole.Tests.ps1 ]] \
            || { echo "::error::Billing role helper test is missing"; exit 1; }
          [[ -f tests/scripts/discover-subs.Tests.sh ]] \
            || { echo "::error::discovery test is missing"; exit 1; }
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Test SubscriptionVending PowerShell module
        if: steps.accelerator.outputs.available == 'true'
        shell: pwsh
        run: ./tests/PowerShell/SubscriptionVending.Tests.ps1

      - name: Test Bicep request compiler
        if: steps.accelerator.outputs.available == 'true'
        shell: pwsh
        run: ./tests/PowerShell/BicepStarter.Tests.ps1

      - name: Test billing role helper
        if: steps.accelerator.outputs.available == 'true'
        shell: pwsh
        run: ./tests/PowerShell/BillingRole.Tests.ps1

      - name: Build Bicep starter
        if: hashFiles('bicep/main.bicep') != ''
        shell: bash
        run: |
          az bicep install --version v0.47.16
          az bicep build --file bicep/main.bicep

      - name: Validate Bicep platform example
        if: hashFiles('bicep/platform.schema.json') != ''
        shell: bash
        run: |
          pipx install 'check-jsonschema==0.37.2'
          files=(bicep/platform.example.json)
          [[ ! -f bicep/platform.json ]] || files+=(bicep/platform.json)
          check-jsonschema \
            --schemafile bicep/platform.schema.json \
            "${files[@]}"

      - name: Test subscription discovery
        if: steps.accelerator.outputs.available == 'true'
        shell: bash
        run: bash tests/scripts/discover-subs.Tests.sh

      - uses: hashicorp/setup-terraform@v4
        if: hashFiles('bootstrap/**') != ''
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Validate bootstrap Terraform
        if: hashFiles('bootstrap/**') != ''
        working-directory: bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------------------
  # 3) Plan each affected subscription in its own job (per-state isolation)
  # ---------------------------------------------------------------------------
  plan:
    name: Plan ${{ matrix.archetype }}/${{ matrix.name }}
    needs: [schema-validate, discover, accelerator-validate]
    if: needs.accelerator-validate.outputs.sources-available != 'true' && needs.discover.outputs.count != '0' && (vars.VENDING_ENGINE == '' || vars.VENDING_ENGINE == 'terraform')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      ARM_USE_AZUREAD: 'true'
      ARM_USE_OIDC:    'true'
      ARM_CLIENT_ID:        ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:        ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME: '60m'
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (per-sub state)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=${{ matrix.state_key }}" \
            -backend-config="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_sub_yaml_path: ../${{ matrix.sub_path }}
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const trimmed = plan.length > 60000 ? plan.slice(0, 60000) + '\n...[truncated]' : plan;
            const body = `### Plan: \`${{ matrix.archetype }}/${{ matrix.name }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${trimmed}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - uses: actions/upload-artifact@v7
        with:
          name: plan-${{ matrix.archetype }}-${{ matrix.name }}
          path: terraform/tfplan
          retention-days: 7

  bicep-preview:
    name: What-if ${{ matrix.archetype }}/${{ matrix.name }}
    needs: [schema-validate, discover, accelerator-validate]
    if: needs.accelerator-validate.outputs.sources-available != 'true' && needs.discover.outputs.count != '0' && vars.VENDING_ENGINE == 'bicep'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep request compiler dependencies
        shell: pwsh
        run: Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Compile subscription request
        shell: pwsh
        run: |
          Import-Module ./bicep/SubscriptionVending.Bicep.psm1
          New-BicepSubscriptionParameters `
            -RequestPath '${{ matrix.sub_path }}' `
            -PlatformPath './bicep/platform.json' `
            -OutputPath './bicep/request.parameters.json'

      - name: Validate and preview Bicep deployment
        shell: bash
        run: |
          az bicep install --version v0.47.16
          deployment_name="$(printf 'vend-%s' '${{ matrix.name }}' | cut -c1-64)"
          az deployment mg validate \
            --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --name "$deployment_name" \
            --template-file bicep/main.bicep \
            --parameters @bicep/request.parameters.json
          az deployment mg what-if \
            --management-group-id "${{ vars.ALZ_ROOT_MANAGEMENT_GROUP_ID }}" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --name "$deployment_name" \
            --template-file bicep/main.bicep \
            --parameters @bicep/request.parameters.json \
            --no-pretty-print > bicep/what-if.txt

      - name: Comment what-if on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const preview = fs.readFileSync('bicep/what-if.txt', 'utf8');
            const trimmed = preview.length > 60000 ? preview.slice(0, 60000) + '\n...[truncated]' : preview;
            const body = `### What-if: \`${{ matrix.archetype }}/${{ matrix.name }}\`\n\n<details><summary>Show preview</summary>\n\n\`\`\`text\n${trimmed}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - uses: actions/upload-artifact@v7
        with:
          name: what-if-${{ matrix.archetype }}-${{ matrix.name }}
          path: bicep/what-if.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4) Final gate - fails the check if any required job failed
  # ---------------------------------------------------------------------------
  result:
    name: PR Validate Result
    needs: [schema-validate, discover, accelerator-validate, plan, bicep-preview]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.schema-validate.result }}" == "failure" || "${{ needs.schema-validate.result }}" == "cancelled" ]]; then
            echo "Schema validation failed or was cancelled."
            exit 1
          fi
          if [[ "${{ needs.discover.result }}" == "failure" || "${{ needs.discover.result }}" == "cancelled" ]]; then
            echo "Subscription discovery failed or was cancelled."
            exit 1
          fi
          if [[ "${{ needs.accelerator-validate.result }}" == "failure" || "${{ needs.accelerator-validate.result }}" == "cancelled" ]]; then
            echo "Accelerator validation failed or was cancelled."
            exit 1
          fi
          if [[ "${{ needs.plan.result }}" == "failure" || "${{ needs.plan.result }}" == "cancelled" ]]; then
            echo "One or more plan jobs failed or were cancelled."
            exit 1
          fi
          if [[ "${{ needs.bicep-preview.result }}" == "failure" || "${{ needs.bicep-preview.result }}" == "cancelled" ]]; then
            echo "One or more Bicep preview jobs failed or were cancelled."
            exit 1
          fi
          echo "All checks completed."
