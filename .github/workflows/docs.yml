name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'landingzones/README.md'
      - 'scripts/README.md'
      - '.github/CICD.md'
      - 'README.md'
      - 'SUPPORT.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'landingzones/README.md'
      - 'scripts/README.md'
      - '.github/CICD.md'
      - 'README.md'
      - 'SUPPORT.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        shell: bash
        env:
          HUGO_VERSION: 0.167.0
          HUGO_SHA256: 2d012c4490248195e2db07e89ce7f76af8bead93233e930bdf3733c53acd3b23
        run: |
          package="${RUNNER_TEMP}/hugo.deb"
          curl --fail --location --silent --show-error \
            --output "$package" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${package}" | sha256sum --check
          sudo dpkg --install "$package"

      - name: Install verified Geekdoc theme
        shell: pwsh
        run: ./website/Install-Theme.ps1

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build Hugo site
        shell: bash
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base_url="${PAGES_BASE_URL:-https://haflidif.github.io/alz-sub-vending-accelerator}"
          hugo \
            --source website \
            --minify \
            --gc \
            --baseURL "${base_url}/"

      - name: Validate generated site
        run: >-
          python website/scripts/check-site.py
          website/public
          --base-path /alz-sub-vending-accelerator/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/public

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
